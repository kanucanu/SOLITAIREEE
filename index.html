<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b5f86">
<meta name="description" content="Korálové sny – podmořský TriPeaks solitaire s 50 levely a opravováním podmořského království.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Korálové sny">
<title>Korálové sny</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-screen="title">

<!-- ===================== SVG sprite: barvy karet a ikony ===================== -->
<svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gCoin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe98a"/><stop offset="1" stop-color="#ffb81c"/></linearGradient>
    <linearGradient id="gStar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff07a"/><stop offset="1" stop-color="#ffab1c"/></linearGradient>
  </defs>
  <!-- barvy karet -->
  <symbol id="s-h" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21.6C5 16.2 2 12.7 2 8.7 2 5.6 4.4 3 7.4 3c1.9 0 3.6 1 4.6 2.6C13 4 14.7 3 16.6 3 19.6 3 22 5.6 22 8.7c0 4-3 7.5-10 12.9z"/></symbol>
  <symbol id="s-d" viewBox="0 0 24 24"><path fill="currentColor" d="M12 1.5 20.5 12 12 22.5 3.5 12z"/></symbol>
  <symbol id="s-c" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="12" cy="6.8" r="4.6"/><circle cx="6.6" cy="13.6" r="4.6"/><circle cx="17.4" cy="13.6" r="4.6"/><path d="M12 10.5 9.2 22h5.6z"/></g></symbol>
  <symbol id="s-s" viewBox="0 0 24 24"><path fill="currentColor" d="M12 1.5C9 6 2.8 9.5 2.8 14c0 2.9 2.2 5 4.8 5 1.6 0 2.9-.7 3.6-1.8L10 22.5h4l-1.2-5.3c.7 1.1 2 1.8 3.6 1.8 2.6 0 4.8-2.1 4.8-5 0-4.5-6.2-8-9.2-12.5z"/></symbol>
  <!-- ikony -->
  <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12.6" r="11" fill="#d98a0b"/><circle cx="12" cy="11.4" r="10.4" fill="url(#gCoin)"/><circle cx="12" cy="11.4" r="7.4" fill="none" stroke="#e8a018" stroke-width="1.3"/><path d="M12 16 7.6 9.3c.6-2.4 8.2-2.4 8.8 0z" fill="#f0a915"/><path d="M12 15.5V8.2M12 15.5 9.6 8.6M12 15.5l2.4-6.9" stroke="#ffe48a" stroke-width=".9"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.2l2.95 6.1 6.65.85-4.9 4.6 1.25 6.6L12 17.1l-5.95 3.25 1.25-6.6-4.9-4.6 6.65-.85z" fill="url(#gStar)" stroke="#e48a00" stroke-width="1.4" stroke-linejoin="round"/><path d="M9.3 9.6l2.1-4" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".8"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor"><circle cx="12" cy="12" r="5.6" stroke-width="3"/><circle cx="12" cy="12" r="8.6" stroke-width="3.4" stroke-dasharray="3.4 3.35"/></g></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 11.5 12 4l8.5 7.5M6 10v9.5h4.5v-5h3v5H18V10" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 4.5 7.5 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 5 4 9.5 8.5 14"/><path d="M4.5 9.5H14a5.5 5.5 0 0 1 0 11h-4"/></g></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3.5c5 0 6 10 11 10H21M3 17h3.5c2 0 3.2-1.6 4.2-3.5M13.3 10.5c1-1.9 2.2-3.5 4.2-3.5H21"/><path d="M18 4l3 3-3 3M18 14l3 3-3 3"/></g></symbol>
  <symbol id="i-wild" viewBox="0 0 24 24"><path d="M12 1.5c.9 5.6 3.9 8.6 9.5 9.5-5.6.9-8.6 3.9-9.5 9.5-.9-5.6-3.9-8.6-9.5-9.5 5.6-.9 8.6-3.9 9.5-9.5z" fill="currentColor"/><path d="M19.5 16.5c.3 1.6 1 2.3 2.5 2.5-1.5.3-2.2 1-2.5 2.5-.3-1.5-1-2.2-2.5-2.5 1.5-.2 2.2-.9 2.5-2.5z" fill="currentColor"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17.5h6M9.8 21h4.4M8.6 14.6A6.5 6.5 0 1 1 15.4 14.6c-.8.7-1.2 1.5-1.2 2.4H9.8c0-.9-.4-1.7-1.2-2.4z"/></g></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="11" rx="3" fill="currentColor"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.8"/><circle cx="12" cy="15.5" r="1.7" fill="#000" opacity=".35"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><circle cx="7.5" cy="12" r="4.2"/><path d="M11.7 12H21M17.5 12v3.5M20.5 12v2.5"/></g></symbol>
  <symbol id="i-map" viewBox="0 0 24 24"><path d="M3 6.2 9 4l6 2.2L21 4v13.8L15 20l-6-2.2L3 20z" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"/><path d="M9 4v13.8M15 6.2V20" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-album" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="16" rx="2.5"/><path d="M3.5 15.5l4.5-4.5 4 4 3-3 5 5"/><circle cx="15.5" cy="8.5" r="1.6"/></g></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5L19.5 6.5" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M3.5 9h4l5-4.5v15l-5-4.5h-4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.3 5.8a9 9 0 0 1 0 12.4" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 17.5V5.5l11-2.5v12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><ellipse cx="6.3" cy="17.6" rx="3.3" ry="2.6" fill="currentColor"/><ellipse cx="17.3" cy="15.2" rx="3.3" ry="2.6" fill="currentColor"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M3.5 9h4l5-4.5v15l-5-4.5h-4z" fill="currentColor"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6.5h16M4 12h16M4 17.5h16" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></symbol>
</svg>

<div id="app">

  <!-- ===================== TITULNÍ OBRAZOVKA (hlavní menu) ===================== -->
  <section id="scr-title" class="screen active">
    <div class="scene-holder" id="titleScene"></div>
    <div class="title-shade"></div>
    <div class="title-wrap">
      <h1 class="logo"><span class="logo-a">Korálové</span><span class="logo-b">sny</span><span class="logo-sub">podmořský solitaire</span></h1>
      <div class="title-guide" id="titleGuide"></div>
      <div class="title-btns">
        <button class="btn btn-green btn-xl" data-act="home" id="titleContinue">Hrát</button>
        <div class="row">
          <button class="btn btn-blue" data-act="map">Mapa levelů</button>
          <button class="btn btn-blue" data-act="album">Album scén</button>
        </div>
        <div class="row">
          <button class="btn btn-orange" data-act="help">Jak hrát</button>
          <button class="btn btn-gray" data-act="settings">Nastavení</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===================== DOMOV = DEKORAČNÍ SCÉNA ===================== -->
  <section id="scr-home" class="screen">
    <div class="scene-holder" id="homeScene"></div>
    <div class="hud-top">
      <div class="hud-left">
        <button class="round-btn" data-act="title" aria-label="Menu"><svg class="ico"><use href="#i-menu"/></svg></button>
        <div class="pill coin-pill"><svg class="pill-ico"><use href="#i-coin"/></svg><span class="coins-val">0</span></div>
      </div>
      <div class="scene-title" id="homeTitle"></div>
      <div class="hud-right">
        <div class="pill star-pill"><svg class="pill-ico"><use href="#i-star"/></svg><span class="stars-val">0</span></div>
        <button class="round-btn" data-act="settings" aria-label="Nastavení"><svg class="ico"><use href="#i-gear"/></svg></button>
      </div>
    </div>
    <div class="guide" id="homeGuide"><div class="guide-bubble" id="guideBubble"></div><div class="guide-pic" id="guidePic"></div></div>
    <button class="tasks-btn" id="tasksBtn"></button>
    <div class="home-mid">
      <button class="mini-btn" data-act="map"><svg class="ico"><use href="#i-map"/></svg><span>Mapa</span></button>
      <button class="mini-btn" data-act="album"><svg class="ico"><use href="#i-album"/></svg><span>Album</span></button>
      <button class="mini-btn bonus-btn" id="bonusBtn"><svg class="ico"><use href="#i-coin"/></svg><span class="bn-t">0:00</span></button>
    </div>
    <button class="play-btn" id="playBtn"></button>
  </section>

  <!-- ===================== MAPA LEVELŮ ===================== -->
  <section id="scr-map" class="screen">
    <div class="map-scroll scrollable" id="mapScroll"><div class="map-inner" id="mapInner"></div></div>
    <div class="hud-top map-hud">
      <div class="hud-left">
        <button class="round-btn" data-act="home" aria-label="Zpět"><svg class="ico"><use href="#i-back"/></svg></button>
        <div class="pill coin-pill"><svg class="pill-ico"><use href="#i-coin"/></svg><span class="coins-val">0</span></div>
      </div>
      <div class="scene-title"><small>Celkem 50 levelů</small>Mapa levelů</div>
      <div class="hud-right">
        <div class="pill star-pill"><svg class="pill-ico"><use href="#i-star"/></svg><span class="stars-val">0</span></div>
      </div>
    </div>
  </section>

  <!-- ===================== HRA ===================== -->
  <section id="scr-game" class="screen">
    <div class="game-bg"><svg viewBox="0 0 400 200" preserveAspectRatio="none" class="gb-weed l"><path d="M0 200 C40 120 10 60 50 0 M30 200 C70 140 50 80 90 40 M70 200 C90 160 80 120 110 90" stroke="#ffffff" stroke-opacity=".07" stroke-width="14" fill="none" stroke-linecap="round"/></svg><svg viewBox="0 0 400 200" preserveAspectRatio="none" class="gb-weed r"><path d="M400 200 C360 120 390 60 350 0 M370 200 C330 140 350 80 310 40 M330 200 C310 160 320 120 290 90" stroke="#ffffff" stroke-opacity=".07" stroke-width="14" fill="none" stroke-linecap="round"/></svg></div>
    <div class="g-top">
      <div class="hud-left">
        <button class="round-btn" id="gHome" aria-label="Domů"><svg class="ico"><use href="#i-home"/></svg></button>
        <div class="pill coin-pill"><svg class="pill-ico"><use href="#i-coin"/></svg><span class="coins-val">0</span></div>
      </div>
      <div class="g-mid">
        <div class="g-level" id="gLevel">Level 1</div>
        <div class="streak" id="gStreak"></div>
      </div>
      <div class="hud-right">
        <div class="g-stars" id="gStars"></div>
        <button class="round-btn" id="gSound" aria-label="Zvuk"></button>
      </div>
    </div>
    <div class="g-board" id="board"></div>
    <div class="g-bar">
      <div class="boost-group">
        <button class="boost" data-b="undo"><span class="bico"><svg class="ico"><use href="#i-undo"/></svg></span><span class="blbl">Zpět</span><span class="bcount"></span></button>
        <button class="boost" data-b="shuffle"><span class="bico"><svg class="ico"><use href="#i-shuffle"/></svg></span><span class="blbl">Zamíchat</span><span class="bcount"></span></button>
      </div>
      <div class="piles">
        <div class="stock" id="stock" aria-label="Balíček"></div>
        <div class="waste" id="waste"></div>
      </div>
      <div class="boost-group">
        <button class="boost wild" data-b="wild"><span class="bico"><svg class="ico"><use href="#i-wild"/></svg></span><span class="blbl">Žolík</span><span class="bcount"></span></button>
        <button class="boost" data-b="hint"><span class="bico"><svg class="ico"><use href="#i-bulb"/></svg></span><span class="blbl">Nápověda</span><span class="bcount free">zdarma</span></button>
      </div>
    </div>
  </section>

  <div id="fx"></div>
  <div id="modals"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script src="js/storage.js"></script>
<script src="js/levels.js"></script>
<script src="js/engine.js"></script>
<script src="js/sound.js"></script>
<script src="js/music.js"></script>
<script src="js/art.js"></script>
<script src="js/scenes.js"></script>
<script src="js/ui.js"></script>
<script src="js/home.js"></script>
<script src="js/map.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
<script>
  // průvodkyně Tóňa na titulní a domovské obrazovce
  document.getElementById('guidePic').innerHTML = CD.Art.turtle();
  document.getElementById('titleGuide').innerHTML = CD.Art.turtle('big');
</script>
</body>
</html>
